name: Refresh industry pages

on:
  schedule:
    - cron: "17 9 * * 1"   # Mondays 09:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["finder/pages.py"]

permissions:
  contents: write

concurrency:
  group: pages-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build pages from live data
        run: python -m finder.pages
      - name: Publish
        run: |
          git config user.name "teamingscout-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          git commit -m "Refresh industry pages" || echo "No change"
          git push
      - name: Notify search engines (after the site redeploys)
        run: |
          sleep 120
          PING_SEARCH=true python -c "from finder import pages; import datetime; \
          urls=['https://teamingscout.com/','https://teamingscout.com/industries/']+['https://teamingscout.com/industries/%s.html'%c for c in pages.INDUSTRIES]; pages.ping_indexnow(urls)"
